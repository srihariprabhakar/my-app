alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
ingress:
  rules:
  - component:
      name: web
    match:
      path:
        prefix: /
name: my-app
region: nyc
services:
- name: web
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs
  run_command: node server.js
  source_dir: /
  envs:
  - key: PORT
    value: "8080"
